  <path d="M500 344 H765 V464" stroke="#b45309" stroke-width="1.7" stroke-dasharray="6 5" fill="none" marker-end="url(#cloud-arrow)"/>
  <rect x="680" y="464" width="188" height="82" rx="12" fill="#fff4df" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="774" y="484" font-size="10" font-weight="700" letter-spacing="1.5" fill="#a16207">OPTIONAL</text>
  <text x="774" y="508" font-size="18" font-weight="700" fill="#92400e">Cloud APIs</text>
